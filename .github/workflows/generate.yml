name: Generate Repository Index

# Triggered manually or when app configs change.
# Regenerates the F-Droid index from current state without running
# the full discovery/download pipeline.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "config/config.json"

concurrency:
  group: fdhub-generate
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  generate:
    name: Generate and Publish Index
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.FDHUB_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install FDHub
        run: pip install -e .

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "11076708"
          accept-android-sdk-licenses: true
          packages: "build-tools;34.0.0"

      - name: Generate index
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS || 'repokey' }}
        run: fdhub generate-index

      - name: Write Netlify redirects from index
        run: |
          python - << 'EOF'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "src")
          from fdhub.fdroid.redirects import write_redirects

          index_path = Path("generated/repo/index-v2.json")
          if not index_path.exists():
              print("No index-v2.json yet; skipping redirects")
              raise SystemExit(0)

          index = json.loads(index_path.read_text(encoding="utf-8"))
          n = write_redirects(index, Path("generated/_redirects"))
          print(f"Wrote {n} redirect(s)")
          EOF

      - name: Copy Repository Icon
        run: cp assets/icon.png generated/repo/icon.png || true

      - name: Deploy to Netlify
        run: npx --yes netlify-cli deploy --prod --dir=generated --site "$NETLIFY_SITE_ID"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
