[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fdhub"
version = "0.1.0"
description = "GitHub-native F-Droid binary repository generator"
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "FDHub Contributors" }]

dependencies = [
    # HTTP client (async, sync)
    "httpx[http2]>=0.27",
    # Data validation & models
    "pydantic>=2.7",
    # CLI framework
    "click>=8.1",
    # JSON schema validation
    "jsonschema>=4.22",
    # APK parsing
    "androguard>=4.1",
    # File path globbing
    "wcmatch>=8.5",
    # Rich terminal output
    "rich>=13.7",
    # Async support utilities
    "anyio>=4.3",
    # Cryptography (certificate parsing)
    "cryptography>=42.0",
    # TOML parsing (Python 3.11+ stdlib has tomllib for reading)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",      # httpx mock
    "ruff>=0.4",
    "mypy>=1.10",
    "types-jsonschema",
]

[project.scripts]
fdhub = "fdhub.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
